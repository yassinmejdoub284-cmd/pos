<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" (click)="onBackdropClick($event)">
  <div class="bg-white rounded-2xl border border-amber-100/50 max-w-2xl w-full shadow-2xl ring-1 ring-amber-50">
    <!-- Header -->
    <div class="bg-gradient-to-r from-amber-50 to-orange-50 p-6 border-b border-amber-200/60 rounded-t-2xl">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-4">
          <div class="w-12 h-12 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg ring-2 ring-indigo-100">
            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
          </div>
          <div>
            <h2 class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
              Gestion des Clients
            </h2>
            <p class="text-sm text-amber-600/70 font-medium">Que souhaitez-vous faire ?</p>
          </div>
        </div>
        <button (click)="onClose()" 
          title="Fermer"
          class="p-2 text-amber-500 hover:text-amber-700 hover:bg-amber-50 rounded-xl transition-all duration-200 hover:scale-105">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Actions Grid -->
    <div class="p-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div *ngFor="let action of clientActions" 
             (click)="onActionClick(action.id)"
             class="group cursor-pointer bg-white rounded-2xl p-6 shadow-lg border border-amber-100/50 hover:shadow-xl hover:scale-105 transition-all duration-300 ring-1 ring-amber-50 relative overflow-hidden">
          
          <!-- Icon Container -->
          <div class="w-16 h-16 bg-gradient-to-br rounded-2xl flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform duration-300 shadow-lg ring-2 ring-white/50" 
               [ngClass]="action.color">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="action.icon"></path>
            </svg>
          </div>
          
          <!-- Title and Description -->
          <h3 class="text-lg font-semibold text-amber-800 mb-2 text-center group-hover:text-amber-600 transition-colors">
            {{ action.title }}
          </h3>
          <p class="text-sm text-amber-600/70 text-center group-hover:text-amber-600 transition-colors font-medium">
            {{ action.description }}
          </p>
          
          <!-- Hover Effect -->
          <div class="absolute inset-0 rounded-2xl bg-gradient-to-br opacity-0 group-hover:opacity-10 transition-opacity duration-300" 
               [ngClass]="action.gradient"></div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="bg-gradient-to-r from-amber-50/50 to-orange-50/50 p-4 border-t border-amber-200/60 rounded-b-2xl">
      <div class="flex justify-center">
        <button (click)="onClose()" 
          class="px-6 py-2 bg-white/80 hover:bg-white text-amber-700 rounded-lg transition-all duration-200 hover:scale-105 shadow-sm border border-amber-200/50">
          Annuler
        </button>
      </div>
    </div>
  </div>
</div>
