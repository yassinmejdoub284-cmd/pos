<div class="min-h-screen bg-gray-100 p-6">
  <!-- Header -->
  <div class="bg-white/80 backdrop-blur-sm rounded-2xl p-6 mb-6 shadow-lg border border-slate-200/50">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-gradient-to-br from-orange-500 to-red-600 rounded-xl flex items-center justify-center shadow-lg">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-slate-800">{{ getDocumentTypeLabel() }}</h1>
          <p class="text-slate-600 font-medium">{{ document?.numero || 'Chargement...' }}</p>
        </div>
      </div>
       <div class="flex gap-3">
         <button (click)="goToScan()" 
           class="bg-gradient-to-r from-green-500 to-green-600 text-white px-6 py-3 rounded-xl font-semibold transition-all duration-200 shadow-lg flex items-center gap-2">
           <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
             <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
           </svg>
           Nouveau Scan
         </button>
         <button (click)="printDocument()" 
           class="bg-gradient-to-r from-orange-500 to-orange-600 text-white px-6 py-3 rounded-xl font-semibold transition-all duration-200 shadow-lg flex items-center gap-2">
           <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
             <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
           </svg>
           Imprimer
         </button>
         <button *ngIf="canGenerateInvoice()" (click)="openInvoiceModal()" 
           class="bg-gradient-to-r from-emerald-500 to-emerald-600 text-white px-6 py-3 rounded-xl font-semibold transition-all duration-200 shadow-lg flex items-center gap-2">
           <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
             <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
           </svg>
           Générer facture
         </button>
         <button (click)="goBack()" 
           class="bg-gradient-to-r from-slate-100 to-slate-200 text-slate-700 px-6 py-3 rounded-xl font-semibold transition-all duration-200 shadow-lg flex items-center gap-2">
           <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
             <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"></path>
           </svg>
           Retour
         </button>
       </div>
    </div>
  </div>

  <!-- Error Message -->
  <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg mb-6">
    {{ error }}
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="text-center py-16">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-orange-600 mx-auto"></div>
    <p class="text-gray-600 mt-4">Chargement du document...</p>
  </div>

  <!-- Document Display (EXACTLY like bon-livraison print template with logos) -->
  <div *ngIf="!loading && document && safeDocumentHtml" class="document-display-container">
    <!-- Print Styles -->
    <style [innerHTML]="printStyles"></style>
    
    <!-- Document Content (EXACT HTML from print template) -->
    <div class="document-wrapper" [innerHTML]="safeDocumentHtml"></div>
  </div>

  <!-- Invoice Modal -->
  <div *ngIf="showInvoiceModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" (click)="cancelInvoice()">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md" (click)="$event.stopPropagation()">
      <div class="p-5 border-b">
        <h3 class="text-lg font-semibold">Générer facture</h3>
      </div>
      <div class="p-5 space-y-4">
        <label class="block text-sm font-medium text-slate-700">Numéro de facture</label>
        <input [(ngModel)]="invoiceNumber" type="text" name="invoiceNumber" placeholder="Ex: FAC-202510-0001" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent" />
      </div>
      <div class="p-5 border-t flex gap-3 justify-end">
        <button (click)="cancelInvoice()" class="px-4 py-2 rounded-lg bg-slate-200">Annuler</button>
        <button (click)="confirmGenerateInvoice()" [disabled]="!invoiceNumber" class="px-4 py-2 rounded-lg bg-emerald-600 text-white disabled:opacity-50">Générer</button>
      </div>
    </div>
  </div>
</div>
