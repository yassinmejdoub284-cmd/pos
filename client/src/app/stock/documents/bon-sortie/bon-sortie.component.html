<div class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 p-6">
  <!-- Header -->
  <div class="bg-white/80 backdrop-blur-sm rounded-2xl p-6 mb-6 shadow-lg border border-slate-200/50">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-gradient-to-br from-red-500 to-rose-600 rounded-xl flex items-center justify-center shadow-lg">
          <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M20 12H4m8-8v16" clip-rule="evenodd"></path>
          </svg>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-slate-800">Bon de Sortie</h1>
          <p class="text-slate-600 font-medium">Document de sortie de stock</p>
        </div>
      </div>
      <div class="flex gap-3">
        <button (click)="goBack()" 
          class="bg-gradient-to-r from-slate-100 to-slate-200 text-slate-700 px-6 py-3 rounded-xl font-semibold transition-all duration-200 shadow-lg flex items-center gap-2">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"></path>
          </svg>
          Retour
        </button>
        <button (click)="printDocument()" *ngIf="document"
          class="bg-gradient-to-r from-blue-500 to-indigo-600 text-white px-6 py-3 rounded-xl font-semibold transition-all duration-200 shadow-lg flex items-center gap-2">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M5 4v3H4a2 2 0 00-2 2v3a2 2 0 002 2h1v2a2 2 0 002 2h6a2 2 0 002-2v-2h1a2 2 0 002-2V9a2 2 0 00-2-2h-1V4a2 2 0 00-2-2H7a2 2 0 00-2 2zm8 0H7v3h6V4zm0 8H7v4h6v-4z" clip-rule="evenodd"></path>
          </svg>
          Imprimer
        </button>
      </div>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="flex justify-center items-center py-12">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
  </div>

  <!-- Error Message -->
  <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6">
    {{ error }}
  </div>

  <!-- Success Message -->
  <div *ngIf="success" class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg mb-6">
    {{ success }}
  </div>

  <!-- Form Content -->
  <div *ngIf="!loading" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Main Form -->
    <div class="lg:col-span-2 space-y-6">
      <!-- Document Info -->
      <div class="bg-white rounded-2xl p-6 shadow-lg border border-slate-200">
        <h2 class="text-xl font-bold text-slate-800 mb-4">Informations du Document</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- From Depot Selection -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Dépôt d'Origine</label>
            <button (click)="openDepotModal('from')" 
              class="w-full text-left bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-slate-700">
              {{ selectedFromDepot ? selectedFromDepot.name : 'Sélectionner un dépôt' }}
            </button>
          </div>

          <!-- To Depot Selection -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Dépôt de Destination</label>
            <button (click)="openDepotModal('to')" 
              class="w-full text-left bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-slate-700">
              {{ selectedToDepot ? selectedToDepot.name : 'Sélectionner un dépôt' }}
            </button>
          </div>
        </div>

        <!-- Notes -->
        <div class="mt-4">
          <label class="block text-sm font-medium text-slate-700 mb-2">Notes</label>
          <textarea [(ngModel)]="notes" 
            class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-slate-700"
            rows="3" placeholder="Notes additionnelles..."></textarea>
        </div>
      </div>

      <!-- Items Section -->
      <div class="bg-white rounded-2xl p-6 shadow-lg border border-slate-200">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-bold text-slate-800">Articles</h2>
          <button (click)="addItem()" 
            class="bg-gradient-to-r from-red-500 to-rose-600 text-white px-4 py-2 rounded-lg font-semibold transition-all duration-200 flex items-center gap-2">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"></path>
            </svg>
            Ajouter Article
          </button>
        </div>

        <!-- Items List -->
        <div class="space-y-4">
          <div *ngFor="let item of items; let i = index" 
            class="border border-slate-200 rounded-lg p-4 bg-slate-50">
            <div class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
              <!-- Product Selection -->
              <div class="md:col-span-2">
                <label class="block text-sm font-medium text-slate-700 mb-1">Produit</label>
                <button (click)="showProductModal = true" 
                  class="w-full text-left bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-700">
                  {{ item.product?.name || 'Sélectionner un produit' }}
                </button>
              </div>

              <!-- Quantity -->
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Quantité</label>
                <input type="number" [(ngModel)]="item.quantity" min="0" step="0.01"
                  class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-700">
              </div>

              <!-- Batch -->
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Lot</label>
                <input type="text" [(ngModel)]="item.batch"
                  class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-700">
              </div>

              <!-- Remove Button -->
              <div>
                <button (click)="removeItem(i)" 
                  class="w-full bg-red-500 text-white px-3 py-2 rounded-lg text-sm font-semibold transition-all duration-200">
                  Supprimer
                </button>
              </div>
            </div>
          </div>

          <!-- Empty State -->
          <div *ngIf="items.length === 0" class="text-center py-8 text-slate-500">
            <svg class="w-12 h-12 mx-auto mb-4 text-slate-300" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 2L3 7v11a1 1 0 001 1h12a1 1 0 001-1V7l-7-5zM8 15v-4h4v4H8z" clip-rule="evenodd"></path>
            </svg>
            <p>Aucun article ajouté</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="space-y-6">
      <!-- Document Summary -->
      <div class="bg-white rounded-2xl p-6 shadow-lg border border-slate-200">
        <h3 class="text-lg font-bold text-slate-800 mb-4">Résumé</h3>
        
        <div class="space-y-3">
          <div class="flex justify-between">
            <span class="text-slate-600">Nombre d'articles:</span>
            <span class="font-semibold">{{ items.length }}</span>
          </div>
          <div class="flex justify-between">
            <span class="text-slate-600">Quantité totale:</span>
            <span class="font-semibold">{{ getTotalQuantity() }}</span>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="bg-white rounded-2xl p-6 shadow-lg border border-slate-200">
        <h3 class="text-lg font-bold text-slate-800 mb-4">Actions</h3>
        
        <div class="space-y-3">
          <button (click)="saveDocument()" 
            class="w-full bg-gradient-to-r from-red-500 to-rose-600 text-white py-3 rounded-lg font-semibold transition-all duration-200">
            {{ documentId && documentId !== 'new' ? 'Mettre à jour' : 'Créer le Document' }}
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Depot Selection Modal -->
  <div *ngIf="showDepotModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-md">
      <div class="p-6 border-b border-slate-200">
        <h3 class="text-lg font-bold text-slate-800">Sélectionner un Dépôt</h3>
      </div>
      <div class="p-6 max-h-96 overflow-y-auto">
        <div class="space-y-2">
          <button *ngFor="let depot of depots" 
            (click)="selectDepot(depot)"
            class="w-full text-left p-3 rounded-lg border border-slate-200 hover:bg-slate-50 transition-colors">
            <div class="font-semibold text-slate-800">{{ depot.name }}</div>
            <div class="text-sm text-slate-500">{{ depot.code }} - {{ depot.type }}</div>
          </button>
        </div>
      </div>
      <div class="p-6 border-t border-slate-200">
        <button (click)="showDepotModal = false" 
          class="w-full bg-slate-100 text-slate-700 font-semibold py-3 px-4 rounded-xl transition-all duration-200">
          Annuler
        </button>
      </div>
    </div>
  </div>

  <!-- Product Selection Modal -->
  <div *ngIf="showProductModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-2xl">
      <div class="p-6 border-b border-slate-200">
        <h3 class="text-lg font-bold text-slate-800">Sélectionner un Produit</h3>
      </div>
      <div class="p-6 max-h-96 overflow-y-auto">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <button *ngFor="let product of products" 
            (click)="selectProduct(items[items.length - 1], product)"
            class="text-left p-3 rounded-lg border border-slate-200 hover:bg-slate-50 transition-colors">
            <div class="font-semibold text-slate-800">{{ product.name }}</div>
            <div class="text-sm text-slate-500">{{ product.barcode || 'N/A' }} - {{ getProductFamille(product) }}</div>
          </button>
        </div>
      </div>
      <div class="p-6 border-t border-slate-200">
        <button (click)="showProductModal = false" 
          class="w-full bg-slate-100 text-slate-700 font-semibold py-3 px-4 rounded-xl transition-all duration-200">
          Annuler
        </button>
      </div>
    </div>
  </div>
</div>
