<div class="space-y-4">
  <div>
    <label class="block text-sm font-medium text-slate-600 mb-2">Type de gestion</label>
    <div class="space-y-2">
      <label class="flex items-center">
        <input type="radio" [(ngModel)]="isStockable" [value]="true" 
               class="mr-2 text-primary-500 focus:ring-pink-500">
        <span class="text-slate-800">Gérable (quantité & prix)</span>
      </label>
      <label class="flex items-center">
        <input type="radio" [(ngModel)]="isStockable" [value]="false" 
               class="mr-2 text-primary-500 focus:ring-pink-500">
        <span class="text-slate-800">Non Gérable (prix seulement)</span>
      </label>
    </div>
  </div>

  <div>
    <label class="block text-sm font-medium text-slate-600 mb-2">Prix de vente (TND)</label>
    <input type="number" [(ngModel)]="price" step="0.01" min="0"
           class="w-full px-4 py-2 bg-slate-100/50 border border-slate-200/50 rounded-2xl text-slate-800 placeholder-gray-400 focus:ring-2 focus:ring-pink-400 focus:border-indigo-600 transition-all"
           placeholder="Prix de vente">
  </div>

  <div class="flex space-x-3 pt-4">
    <button (click)="onSubmit()" 
            [disabled]="price <= 0"
            class="flex-1 bg-gradient-to-r from-pink-500 to-purple-600 text-slate-800 px-4 py-2 rounded-2xl hover:from-pink-600 hover:to-purple-700 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
      Convertir
    </button>
    <button (click)="onCancel()" 
            class="flex-1 bg-slate-200 text-slate-800 px-4 py-2 rounded-2xl hover:bg-slate-100 transition-all">
      Annuler
    </button>
  </div>
</div>
