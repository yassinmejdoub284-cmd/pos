<div class="space-y-4">
  <div>
    <label class="block text-sm font-medium text-slate-600 mb-2">Type de gestion</label>
    <div class="space-y-2">
      <label class="flex items-center">
        <input type="radio" [(ngModel)]="isStockable" [value]="true" 
               class="mr-2 text-primary-500 focus:ring-pink-500">
        <span class="text-slate-800">Gérable (quantité & prix)</span>
      </label>
      <label class="flex items-center">
        <input type="radio" [(ngModel)]="isStockable" [value]="false" 
               class="mr-2 text-primary-500 focus:ring-pink-500">
        <span class="text-slate-800">Non Gérable (prix seulement)</span>
      </label>
    </div>
  </div>

  <div>
    <label class="block text-sm font-medium text-slate-600 mb-2">Prix de vente (TND)</label>
    <input type="number" [(ngModel)]="price" step="0.01" min="0"
           class="w-full px-4 py-2 bg-slate-100/50 border border-slate-200/50 rounded-2xl text-slate-800 placeholder-gray-400 focus:ring-2 focus:ring-pink-400 focus:border-indigo-600 transition-all"
           placeholder="Prix de vente">
  </div>

  <div>
    <label class="block text-sm font-medium text-slate-600 mb-2">Ratio de Conversion *</label>
    <div class="flex items-center gap-2">
      <span class="text-sm text-slate-600">1 article =</span>
      <input type="number" [(ngModel)]="conversionRatio" step="0.001" min="0.001"
             class="flex-1 px-4 py-2 bg-slate-100/50 border border-slate-200/50 rounded-2xl text-slate-800 placeholder-gray-400 focus:ring-2 focus:ring-pink-400 focus:border-indigo-600 transition-all"
             placeholder="Ex: 200">
      <span class="text-sm text-slate-600">articles cibles</span>
    </div>
    <span class="text-xs text-slate-500 mt-1 block">
      Exemple: 1 JUS 1L = 200 JUS Vrac
    </span>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 pt-2 border-t border-slate-200/50">
    <div>
      <label class="block text-sm font-medium text-slate-600 mb-2">Prix de Vente en Vrac</label>
      <input type="number" [(ngModel)]="prix_vente_vrac" step="0.01" min="0"
             class="w-full px-4 py-2 bg-slate-100/50 border border-slate-200/50 rounded-2xl text-slate-800 placeholder-gray-400 focus:ring-2 focus:ring-pink-400 focus:border-indigo-600 transition-all"
             placeholder="0">
      <span class="text-xs text-slate-500 mt-1 block">Prix de vente pour la version vrac</span>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-600 mb-2">Prix d'Achat en Vrac</label>
      <input type="number" [(ngModel)]="prix_achat_vrac" step="0.001" min="0"
             class="w-full px-4 py-2 bg-slate-100/50 border border-slate-200/50 rounded-2xl text-slate-800 placeholder-gray-400 focus:ring-2 focus:ring-pink-400 focus:border-indigo-600 transition-all"
             placeholder="0">
      <span class="text-xs text-slate-500 mt-1 block">Prix d'achat pour la version vrac</span>
    </div>
  </div>

  <div *ngIf="conversionRatio > 0" class="bg-green-50 border border-green-200 rounded-xl p-3">
    <span class="text-sm font-semibold text-green-800 block mb-1">Quantité Vrac Calculée</span>
    <span class="text-lg font-bold text-green-900">
      1 produit source = {{ getTargetQuantity() | number:'1.0-3' }} produit vrac
    </span>
  </div>

  <div class="flex space-x-3 pt-4">
    <button (click)="onSubmit()" 
            [disabled]="price <= 0 || conversionRatio <= 0"
            class="flex-1 bg-gradient-to-r from-pink-500 to-purple-600 text-slate-800 px-4 py-2 rounded-2xl transition-all disabled:opacity-50 disabled:cursor-not-allowed">
      Convertir
    </button>
    <button (click)="onCancel()" 
            class="flex-1 bg-slate-200 text-slate-800 px-4 py-2 rounded-2xl transition-all">
      Annuler
    </button>
  </div>
</div>
