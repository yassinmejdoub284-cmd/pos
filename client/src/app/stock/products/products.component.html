<div class="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-black p-4">
  <div class="fixed top-6 right-6 z-40">
    <a routerLink="/home"
      class="w-12 h-12 bg-gray-800 text-pink-400 rounded-full shadow-2xl hover:bg-gray-700 transition-all duration-300 transform hover:scale-95 flex items-center justify-center"
      title="Accueil">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
        </path>
      </svg>
    </a>
  </div>

  <div *ngIf="loading" class="flex items-center justify-center">
    <div class="text-center">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-pink-400 mx-auto mb-4"></div>
      <p class="text-gray-400">Chargement...</p>
    </div>
  </div>

  <div *ngIf="error" class="mb-4 p-4 bg-red-900/50 border border-red-500/50 text-red-300 rounded-xl">
    {{ error }}
  </div>

  <app-conservation-warnings (warningsUpdated)="onWarningsUpdated()"></app-conservation-warnings>

  <div *ngIf="!loading" class="space-y-4">
    <div class="bg-gray-800/50 rounded-xl p-4 border border-gray-700/50">
      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
        <h1 class="text-2xl font-bold text-white">Produits</h1>
        
        <div class="flex flex-wrap gap-2 mr-10">
          <button (click)="openAddModal()"
            class="bg-gradient-to-r from-pink-500 to-purple-600 text-white px-4 py-2 rounded-lg hover:from-pink-600 hover:to-purple-700 transition-all flex items-center space-x-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
            </svg>
            <span>Nouveau Produit</span>
          </button>
          
          <button (click)="exportProducts()"
            class="bg-gradient-to-r from-cyan-500 to-sky-600 text-white px-4 py-2 rounded-lg hover:from-cyan-600 hover:to-blue-700 transition-all flex items-center space-x-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
            <span>Export CSV</span>
          </button>
        </div>
      </div>
    </div>

    <div class="bg-gray-800/50 rounded-xl p-4 border border-gray-700/50">
      <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
        <div class="lg:col-span-2">
          <label class="block text-sm font-medium text-gray-300 mb-2">Recherche</label>
          <div class="relative">
            <input type="text" [(ngModel)]="searchQuery" (keyup.enter)="onSearch()"
              placeholder="Référence, nom..."
              class="w-full pl-10 pr-4 py-2 bg-gray-700/50 border border-gray-600/50 rounded-lg text-white placeholder-gray-400 focus:ring-2 focus:ring-pink-400 focus:border-pink-400 transition-all">
            <svg class="absolute right-3 top-2.5 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </div>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">Famille</label>
          <select [(ngModel)]="selectedFamille" (change)="onFilter()"
            class="w-full px-4 py-2 bg-gray-700/50 border border-gray-600/50 rounded-lg text-white focus:ring-2 focus:ring-pink-400 focus:border-pink-400 transition-all">
            <option value="">Toutes les familles</option>
            <option value="Général">Général</option>
            <option value="Pâtisserie">Pâtisserie</option>
            <option value="Viennoiserie">Viennoiserie</option>
            <option value="Boulangerie">Boulangerie</option>
            <option value="Boissons">Boissons</option>
          </select>
        </div>
        

        
        <div class="flex items-end">
          <button (click)="onSearch()"
            class="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white px-4 py-2 rounded-lg hover:from-emerald-600 hover:to-green-700 transition-all">
            Rechercher
          </button>
        </div>
      </div>
    </div>

    <div class="bg-gray-800/50 rounded-xl border border-gray-700/50 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="bg-gray-700/50">
            <tr>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Photo</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Code-barres</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Nom</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Famille</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Prix TTC</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-700/50">
            <tr *ngFor="let product of displayedProducts" class="hover:bg-gray-700/30 transition-colors">
              <td class="px-4 py-3">
                <div class="cursor-pointer" (click)="openImageUploadModal(product)">
                  <img *ngIf="product.photo" [src]="product.photo" [alt]="product.name" 
                    class="w-12 h-12 object-cover rounded-lg hover:opacity-80 transition-opacity">
                  <div *ngIf="!product.photo" class="w-12 h-12 bg-gray-600 rounded-lg flex items-center justify-center hover:bg-gray-500 transition-colors">
                    <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                  </div>
                </div>
              </td>
              <td class="px-4 py-3 text-sm text-white font-mono">{{ product.barcode || '-' }}</td>
              <td class="px-4 py-3 text-sm text-white">{{ product.name }}</td>
              <td class="px-4 py-3 text-sm text-gray-300">{{ product.famille }}</td>
              <td class="px-4 py-3 text-sm text-pink-400 font-bold">{{ product.prix_vente_TTC | currency:'TND' }}</td>
              <td class="px-4 py-3">
                <div class="flex space-x-2">
                  <button (click)="openEditModal(product)" 
                    class="text-blue-400 hover:text-blue-300 transition-colors" title="Modifier">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                    </svg>
                  </button>
                  

                  
                  <button (click)="duplicateProduct(product)" 
                    class="text-purple-400 hover:text-purple-300 transition-colors" title="Dupliquer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                  </button>
                  
                  <button (click)="deleteProduct(product)" 
                    class="text-red-400 hover:text-red-300 transition-colors" title="Supprimer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <div *ngIf="displayedProducts.length === 0" class="text-center py-8">
        <p class="text-gray-400">Aucun produit trouvé</p>
      </div>
    </div>

    <div *ngIf="totalPages > 1" class="bg-gray-800/50 rounded-xl p-4 border border-gray-700/50">
      <div class="flex justify-center space-x-2">
        <button *ngFor="let page of [].constructor(totalPages); let i = index" 
          (click)="onPageChange(i + 1)"
          [class]="'px-3 py-2 rounded-lg transition-all' + (currentPage === i + 1 ? ' bg-pink-500 text-white' : ' bg-gray-700/50 text-gray-300 hover:bg-gray-600/50')">
          {{ i + 1 }}
        </button>
      </div>
    </div>
  </div>
</div>

<app-product-form *ngIf="showAddModal" 
  [product]="editingProduct"
  (saved)="onProductSaved()"
  (cancelled)="closeModal()">
</app-product-form>

<app-bulk-import *ngIf="showImportModal"
  (completed)="onImportCompleted()"
  (cancelled)="closeModal()">
</app-bulk-import>

<app-image-upload-modal 
  *ngIf="showImageUploadModal"
  [show]="showImageUploadModal"
  [currentImageUrl]="selectedProductForImage?.photo || null"
  (uploadConfirmed)="onImageUploadConfirmed($event)"
  (closed)="closeImageUploadModal()">
</app-image-upload-modal>
