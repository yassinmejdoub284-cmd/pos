<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-3xl max-h-[90vh] flex flex-col">
    <!-- Header -->
    <div class="flex items-center justify-between p-4 border-b border-slate-200">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-gradient-to-br from-purple-500 to-indigo-600 rounded-xl flex items-center justify-center shadow-lg">
          <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"></path>
          </svg>
        </div>
        <div>
          <h2 class="text-2xl font-bold text-slate-800">Documents</h2>
          <p class="text-slate-600 font-medium">Traçabilité & historique</p>
        </div>
      </div>
      <button (click)="onClose()" class="text-slate-400 hover:text-slate-600 transition-colors" title="Fermer">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Content -->
    <div class="flex-1 overflow-y-auto p-6">
      <div class="text-center mb-8">
        <h3 class="text-lg font-semibold text-slate-700 mb-2">Que souhaitez-vous consulter ?</h3>
        <p class="text-slate-500">Sélectionnez le type de document que vous souhaitez consulter</p>
      </div>

      <!-- Document Types Grid -->
      <div class="grid grid-cols-2 gap-4">
        <div *ngFor="let docType of documentTypes" 
             (click)="onDocumentSelected(docType)"
             class="cursor-pointer">
          <div class="bg-white rounded-xl border border-slate-200 p-5 text-center h-full flex flex-col justify-center">
            <div class="w-14 h-14 rounded-xl flex items-center justify-center mx-auto mb-3 shadow-lg" 
                 [ngClass]="'bg-gradient-to-br ' + docType.color">
              <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="docType.icon"></path>
              </svg>
            </div>
            
            <h3 class="text-base font-bold text-slate-800 mb-2">
              {{ docType.title }}
            </h3>
            <p class="text-slate-500 text-sm leading-relaxed">
              {{ docType.description }}
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="p-6 border-t border-slate-200">
      <button (click)="onClose()"
        class="w-full bg-slate-100 text-slate-700 font-semibold py-3 px-4 rounded-xl hover:bg-slate-200 transition-all duration-200">
        Annuler
      </button>
    </div>
  </div>
</div>
