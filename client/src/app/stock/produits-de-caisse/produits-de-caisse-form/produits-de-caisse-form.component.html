<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-7xl max-h-[90vh] flex flex-col">
    <!-- Header -->
    <div class="flex items-center justify-between p-6 border-b border-indigo-100/50 bg-gradient-to-r from-indigo-50 to-purple-50">
      <h3 class="text-lg font-semibold text-slate-800">
        {{ produit ? 'Modifier le Sous-Produit' : 'Nouveau Sous-Produit' }}
      </h3>
      <button (click)="onCancel()" class="text-slate-400 transition-colors" title="Fermer">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Error Message -->
    <div *ngIf="error()" class="mx-6 mt-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
      {{ error() }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex-1 overflow-y-auto p-6">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Nom du produit -->
        <div class="lg:col-span-2">
          <label class="block text-sm font-medium text-slate-600 mb-2">Nom du produit *</label>
          <input type="text" formControlName="name"
            class="w-full px-4 py-2 bg-slate-100/50 border border-slate-200/50 rounded-2xl text-slate-800 placeholder-gray-400 focus:ring-2 focus:ring-pink-400 focus:border-indigo-600 transition-all"
            placeholder="Nom du produit">
        </div>

        <!-- Produit Parent -->
        <div class="lg:col-span-2">
          <label class="block text-sm font-medium text-slate-600 mb-2">Produit Parent *</label>
          <select formControlName="parentProductId" title="Sélectionner un produit parent"
            class="w-full px-4 py-2 bg-slate-100/50 border border-slate-200/50 rounded-2xl text-slate-800 focus:ring-2 focus:ring-pink-400 focus:border-indigo-600 transition-all">
            <option value="">Sélectionner un produit parent</option>
            <option *ngFor="let product of allProducts" [value]="product.id">{{ product.name }}</option>
          </select>
        </div>

        <!-- Prix d'achat -->
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-2">Prix d'achat</label>
          <input type="number" formControlName="prix_achat" step="0.001"
            class="w-full px-4 py-2 bg-slate-100/50 border border-slate-200/50 rounded-2xl text-slate-800 placeholder-gray-400 focus:ring-2 focus:ring-pink-400 focus:border-indigo-600 transition-all"
            placeholder="0.000">
        </div>

        <!-- Prix de vente TTC -->
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-2">Prix de vente TTC *</label>
          <input type="number" formControlName="prix_vente_TTC" step="0.01"
            class="w-full px-4 py-2 bg-slate-100/50 border border-slate-200/50 rounded-2xl text-slate-800 placeholder-gray-400 focus:ring-2 focus:ring-pink-400 focus:border-indigo-600 transition-all"
            placeholder="0.00">
        </div>

        <!-- TVA -->
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-2">TVA (%) *</label>
          <input type="number" formControlName="tva" step="0.01"
            class="w-full px-4 py-2 bg-slate-100/50 border border-slate-200/50 rounded-2xl text-slate-800 placeholder-gray-400 focus:ring-2 focus:ring-pink-400 focus:border-indigo-600 transition-all"
            placeholder="19">
        </div>

        <!-- Depot Selection -->
        <div class="lg:col-span-2">
          <app-multi-depot-selector 
            [selectedDepotIds]="selectedDepotIds()"
            [allowedDepotTypes]="['MAIN', 'BRANCH']"
            [required]="true"
            (depotsSelected)="onDepotsSelected($event)">
          </app-multi-depot-selector>
        </div>

        <!-- Image Upload Section -->
        <div class="lg:col-span-2">
          <label class="block text-sm font-medium text-slate-600 mb-2">Photo du produit</label>
          
          <!-- Image Input Type Toggle -->
          <div class="flex space-x-2 mb-3">
            <button type="button" (click)="imageInputType = 'file'" 
              [class]="imageInputType === 'file' ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-600'"
              class="px-3 py-1 rounded-lg text-sm transition-all">
              Fichier
            </button>
            <button type="button" (click)="imageInputType = 'url'"
              [class]="imageInputType === 'url' ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-600'"
              class="px-3 py-1 rounded-lg text-sm transition-all">
              URL
            </button>
          </div>

          <!-- File Upload Input -->
          <div *ngIf="imageInputType === 'file'" class="flex items-center space-x-4">
            <input type="file" (change)="onFileSelected($event)" accept="image/*" title="Sélectionner une photo"
              class="flex-1 px-4 py-2 bg-slate-100/50 border border-slate-200/50 rounded-2xl text-slate-800 file:mr-4 file:py-2 file:px-4 file:rounded-2xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-slate-800">
          </div>

          <!-- URL Input -->
          <div *ngIf="imageInputType === 'url'" class="space-y-2">
            <input type="url" formControlName="photoUrl" 
              class="w-full px-4 py-2 bg-slate-100/50 border border-slate-200/50 rounded-2xl text-slate-800 placeholder-gray-400 focus:ring-2 focus:ring-pink-400 focus:border-indigo-600 transition-all"
              placeholder="https://example.com/image.jpg">
            <button type="button" (click)="loadImageFromUrl()" 
              class="px-4 py-2 bg-indigo-600 text-white rounded-2xl transition-all text-sm">
              Charger l'image
            </button>
          </div>
          
          <!-- Image Preview -->
          <div *ngIf="imagePreview" class="mt-4 flex items-center space-x-4">
            <div class="w-20 h-20">
              <img [src]="imagePreview" alt="Aperçu" class="w-full h-full object-cover rounded-2xl">
            </div>
            <button type="button" (click)="clearImage()" 
              class="px-3 py-1 bg-red-100 text-red-700 rounded-lg transition-all text-sm">
              Supprimer
            </button>
          </div>
        </div>

        <!-- Active Status -->
        <div class="lg:col-span-2 flex items-center">
          <input 
            formControlName="isActive"
            type="checkbox"
            id="isActive"
            class="w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500">
          <label for="isActive" class="ml-2 text-sm text-slate-700">Actif</label>
        </div>

      </div>
    </form>

    <div class="flex space-x-3 p-6 border-t border-indigo-100/50 bg-white">
      <button (click)="onCancel()" type="button"
        class="flex-1 bg-slate-100 text-slate-800 font-semibold py-3 px-4 rounded-2xl transition-all">
        Annuler
      </button>
      <button (click)="onSubmit()" type="submit" [disabled]="!form.valid || loading()"
        class="flex-1 bg-gradient-to-r from-pink-500 to-purple-600 text-slate-800 font-semibold py-3 px-4 rounded-2xl transition-all disabled:opacity-50 disabled:cursor-not-allowed">
        <span *ngIf="loading()" class="flex items-center justify-center">
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-slate-800" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Enregistrement...
        </span>
        <span *ngIf="!loading()">{{ produit ? 'Modifier' : 'Créer' }}</span>
      </button>
    </div>
  </div>
</div>
