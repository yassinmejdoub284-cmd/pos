<!-- Modal Overlay -->
<div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-hidden">
    
    <!-- Header -->
    <div class="flex items-center justify-between p-6 border-b border-slate-200">
      <h2 class="text-xl font-bold text-slate-800">
        {{ produit ? 'Modifier le regroupement' : 'Nouveau regroupement' }}
      </h2>
      <button (click)="onCancel()" class="p-2 hover:bg-slate-100 rounded-lg transition-colors">
        <span class="text-slate-500 text-xl">×</span>
      </button>
    </div>

    <!-- Form Content -->
    <div class="flex flex-col h-[calc(90vh-140px)]">
      
      <!-- Error Message -->
      <div *ngIf="error()" class="bg-red-50 border border-red-200 rounded-xl p-4 m-6 mb-0">
        <span class="text-red-600 font-medium">{{ error() }}</span>
      </div>

      <!-- Scrollable Form Content -->
      <div class="flex-1 overflow-y-auto p-6">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
        
        <!-- Basic Info -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Nom du regroupement</label>
            <input 
              formControlName="name"
              type="text"
              placeholder="ex: Cookies"
              class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          </div>
          
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Prix (DT)</label>
            <input 
              formControlName="price"
              type="number"
              step="0.01"
              min="0.01"
              placeholder="12.00"
              class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          </div>
        </div>

        <!-- Active Status -->
        <div class="flex items-center">
          <input 
            formControlName="isActive"
            type="checkbox"
            id="isActive"
            class="w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500">
          <label for="isActive" class="ml-2 text-sm text-slate-700">Actif</label>
        </div>

        <!-- Products Selection -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-3">
            Produits à regrouper ({{ selectedProducts().length }} sélectionnés)
          </label>
          
          <!-- Search Products -->
          <div class="mb-4">
            <div class="relative">
              <div class="absolute inset-y-0 right-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
              </div>
              <input 
                type="text"
                formControlName="searchQuery"
                placeholder="Rechercher un produit..."
                class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm">
            </div>
          </div>
          
          <!-- Selected Products Preview -->
          <div *ngIf="selectedProducts().length > 0" class="mb-4 p-3 bg-green-50 border border-green-200 rounded-xl">
            <div class="text-sm font-medium text-green-800 mb-2">Produits sélectionnés:</div>
            <div class="flex flex-wrap gap-2">
              <div *ngFor="let productId of selectedProducts()" 
                   class="flex items-center gap-2 px-2 py-1 bg-green-100 text-green-700 text-xs rounded-lg">
                <div class="w-4 h-4 bg-slate-200 rounded overflow-hidden">
                  <img 
                    [src]="getProductImage(productId)" 
                    [alt]="getProductName(productId)"
                    class="w-full h-full object-cover"
                    (error)="onImageError($event)">
                </div>
                <span>{{ getProductName(productId) }}</span>
              </div>
            </div>
          </div>

          <!-- Products Grid -->
          <div class="grid grid-cols-1 gap-2 overflow-y-auto border border-slate-200 rounded-xl p-3">
            <!-- Loading State -->
            <div *ngIf="allProducts.length === 0" class="text-center py-8">
              <div class="text-slate-400 text-sm">Chargement des produits...</div>
            </div>
            
            <!-- Products Grid (3 columns) -->
            <div class="grid grid-cols-3 gap-3">
              <div *ngFor="let product of filteredProducts()" 
                   (click)="toggleProduct(product.id)"
                   class="flex flex-col items-center p-3 rounded-lg cursor-pointer transition-colors border"
                   [class]="isProductSelected(product.id) ? 'bg-blue-100 border-blue-300' : 'bg-slate-50 hover:bg-slate-100 border-slate-200'">
                
                <div class="relative w-full mb-2">
                  <div class="w-16 h-16 bg-slate-200 rounded overflow-hidden mx-auto">
                    <img 
                      [src]="getProductImage(product.id)" 
                      [alt]="product.name"
                      class="w-full h-full object-cover"
                      (error)="onImageError($event)">
                  </div>
                  <input 
                    type="checkbox"
                    [checked]="isProductSelected(product.id)"
                    class="absolute top-1 right-1 w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500"
                    (click)="$event.stopPropagation()">
                </div>
                
                <div class="text-center w-full">
                  <div class="text-xs font-medium text-slate-800 truncate mb-1">{{ product.name }}</div>
                  <div class="text-xs text-slate-500">{{ product.famille?.name || 'Sans catégorie' }}</div>
                </div>
              </div>
            </div>
            
            <!-- No Products Found -->
            <div *ngIf="allProducts.length > 0 && filteredProducts().length === 0" class="text-center py-8">
              <div class="text-slate-400 text-sm">Aucun produit trouvé pour "{{ form.get('searchQuery')?.value }}"</div>
            </div>
          </div>
        </div>

        </form>
      </div>

      <!-- Fixed Actions Bar -->
      <div class="border-t border-slate-200 p-4 bg-white">
        <div class="flex items-center justify-end gap-3">
          <button 
            type="button"
            (click)="onCancel()"
            class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-xl transition-colors">
            Annuler
          </button>
          
          <button 
            type="button"
            (click)="onSubmit()"
            [disabled]="loading() || !form.valid || selectedProducts().length === 0"
            class="px-6 py-2 bg-blue-600 text-white rounded-xl hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
            <span *ngIf="loading()" class="mr-2">⏳</span>
            {{ produit ? 'Modifier' : 'Créer' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
