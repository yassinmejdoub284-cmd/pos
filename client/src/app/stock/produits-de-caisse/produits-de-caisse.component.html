<div class="min-h-screen bg-slate-50 p-4">
  <div class="max-w-7xl mx-auto space-y-6">
    <!-- Header -->
    <div class="bg-white rounded-2xl border border-slate-200 p-6">
      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-4">
          <button 
            routerLink="/home"
            class="p-2 hover:bg-slate-100 rounded-lg transition-colors">
            <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
          </button>
          <div>
            <h1 class="text-2xl font-bold text-slate-800">Produits de Caisse</h1>
            <p class="text-slate-600 mt-1">Gérer les regroupements de produits pour la caisse</p>
          </div>
        </div>
        <button 
          (click)="onProduitAdded()"
          class="px-6 py-3 bg-gradient-to-r from-blue-600 to-blue-700 text-white rounded-xl hover:from-blue-700 hover:to-blue-800 transition-all shadow-lg hover:shadow-xl flex items-center gap-2">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"></path>
          </svg>
          Nouveau Regroupement
        </button>
      </div>

      <!-- Filters -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Search -->
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </div>
          <input 
            type="text"
            [value]="searchQuery()"
            (input)="onSearchChange($event)"
            placeholder="Rechercher par nom..."
            class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-slate-50">
        </div>

        <!-- Category Filter -->
        <div>
          <select 
            [value]="selectedCategory()"
            (change)="onCategoryChange($event)"
            class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-slate-50">
            <option *ngFor="let category of productCategories()" [value]="category">{{ category }}</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Error Message -->
    <div *ngIf="error()" class="bg-red-50 border border-red-200 rounded-xl p-4">
      <div class="flex items-center">
        <span class="text-red-600 font-medium">{{ error() }}</span>
      </div>
    </div>

    <!-- Loading -->
    <div *ngIf="loading()" class="bg-white rounded-2xl border border-slate-200 p-8">
      <div class="flex items-center justify-center">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
        <span class="ml-3 text-slate-600">Chargement...</span>
      </div>
    </div>

    <!-- Content -->
    <div *ngIf="!loading() && !error()">
      <app-produits-de-caisse-list 
        [produitsDeCaisse]="produitsDeCaisse()"
        [allProducts]="allProducts()"
        [searchQuery]="searchQuery()"
        [selectedCategory]="selectedCategory()"
        (produitUpdated)="onProduitUpdated()"
        (produitDeleted)="onProduitDeleted()">
      </app-produits-de-caisse-list>
    </div>

    <!-- Form Modal -->
    <app-produits-de-caisse-form 
      *ngIf="showForm()"
      [produit]="null"
      [allProducts]="allProducts()"
      (close)="onFormClose()"
      (submit)="onFormSubmit()">
    </app-produits-de-caisse-form>
  </div>
</div>
