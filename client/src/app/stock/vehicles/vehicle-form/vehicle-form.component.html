<div class="h-screen w-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 flex flex-col">
  <!-- Header -->
  <div class="bg-white/80 backdrop-blur-sm p-6 shadow-lg border-b border-slate-200/50 flex-shrink-0">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-4">
        <button (click)="goBack()" class="p-2 hover:bg-slate-100 rounded-lg transition-colors" title="Retour">
          <svg class="w-6 h-6 text-slate-600" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"></path>
          </svg>
        </button>
        <div class="w-12 h-12 bg-gradient-to-br from-emerald-500 to-green-600 rounded-xl flex items-center justify-center shadow-lg">
          <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"></path>
          </svg>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-slate-800">
            {{ isEditMode ? 'Modifier le Véhicule' : 'Ajouter un Véhicule' }}
          </h1>
          <p class="text-slate-600 font-medium">
            {{ isEditMode ? 'Modifier les informations du véhicule' : 'Enregistrer un nouveau véhicule' }}
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Form -->
  <div class="flex-1 overflow-y-auto">
    <div class="h-full">
      <div class="bg-white/80 backdrop-blur-sm p-10 shadow-lg h-full flex flex-col">
        <form [formGroup]="vehicleForm" (ngSubmit)="onSubmit()" class="flex flex-col h-full">
        
          <!-- Error Message -->
          <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-700 px-6 py-4 rounded-xl mb-8 text-lg flex-shrink-0">
            {{ error }}
          </div>

          <!-- Form Content -->
          <div class="flex-1 overflow-y-auto">
            <div class="max-w-7xl mx-auto px-6">
              <!-- Matricule Field -->
        <div class="mb-6">
          <label for="matricule" class="block text-sm font-semibold text-slate-700 mb-2">
            Matricule <span class="text-red-500">*</span>
          </label>
          <input 
            type="text" 
            id="matricule"
            formControlName="matricule"
            placeholder="Ex: 206 TU 6520"
            class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
            [class.border-red-500]="vehicleForm.get('matricule')?.invalid && vehicleForm.get('matricule')?.touched">
          <div *ngIf="getFieldError('matricule')" class="text-red-500 text-sm mt-1">
            {{ getFieldError('matricule') }}
          </div>
        </div>

        <!-- Brand Selector -->
        <div class="mb-6">
          <app-brand-selector 
            [selectedBrandId]="selectedBrand()?.id || null"
            [required]="true"
            label="Marque"
            (brandSelected)="onBrandSelected($event)">
          </app-brand-selector>
          <div *ngIf="getFieldError('brand')" class="text-red-500 text-sm mt-1">
            {{ getFieldError('brand') }}
          </div>
        </div>

        <!-- Model Selector -->
        <div class="mb-6">
          <app-model-selector 
            [availableModels]="availableModels()"
            [selectedModelValue]="selectedModel()"
            [required]="true"
            label="Modèle"
            (modelSelected)="onModelSelected($event)">
          </app-model-selector>
          <div *ngIf="getFieldError('model')" class="text-red-500 text-sm mt-1">
            {{ getFieldError('model') }}
          </div>
        </div>

        <!-- Active Status -->
        <div class="mb-8" *ngIf="isEditMode">
          <label class="flex items-center">
            <input 
              type="checkbox" 
              formControlName="isActive"
              class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 focus:ring-2">
            <span class="ml-2 text-sm font-semibold text-slate-700">Véhicule actif</span>
          </label>
            </div>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="flex-shrink-0 border-t border-slate-200/50 pt-8">
            <div class="max-w-7xl mx-auto px-6">
              <div class="flex gap-6">
                <button 
                  type="button" 
                  (click)="goBack()"
                  class="flex-1 bg-slate-200 text-slate-700 px-8 py-4 rounded-xl font-semibold text-lg hover:bg-slate-300 transition-colors">
                  Annuler
                </button>
                <button 
                  type="submit" 
                  [disabled]="loading || vehicleForm.invalid"
                  class="flex-1 bg-gradient-to-r from-emerald-500 to-green-600 text-white px-8 py-4 rounded-xl font-semibold text-lg hover:from-emerald-600 hover:to-green-700 transition-all duration-200 shadow-lg hover:shadow-xl disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-3">
                  <div *ngIf="loading" class="animate-spin rounded-full h-6 w-6 border-b-2 border-white"></div>
                  {{ loading ? 'Enregistrement...' : (isEditMode ? 'Mettre à jour' : 'Enregistrer') }}
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
