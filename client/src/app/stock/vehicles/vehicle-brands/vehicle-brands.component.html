<div class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 p-6">
  <!-- Header -->
  <div class="bg-white/80 backdrop-blur-sm rounded-2xl p-6 mb-6 shadow-lg border border-slate-200/50">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-4">
        <button (click)="goBack()" class="p-2 hover:bg-slate-100 rounded-lg transition-colors" title="Retour">
          <svg class="w-6 h-6 text-slate-600" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"></path>
          </svg>
        </button>
        <div class="w-12 h-12 bg-gradient-to-br from-purple-500 to-indigo-600 rounded-xl flex items-center justify-center shadow-lg">
          <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"></path>
          </svg>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-slate-800">Marques & Modèles</h1>
          <p class="text-slate-600 font-medium">{{ filteredBrands.length }} marque(s)</p>
        </div>
      </div>
      <button (click)="toggleAddForm()" 
        class="bg-gradient-to-r from-purple-500 to-indigo-600 text-white px-6 py-3 rounded-xl font-semibold hover:from-purple-600 hover:to-indigo-700 transition-all duration-200 shadow-lg hover:shadow-xl flex items-center gap-2">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"></path>
        </svg>
        Ajouter Marque
      </button>
    </div>
  </div>

  <!-- Add Brand Form -->
  <div *ngIf="showAddForm" class="bg-white/80 backdrop-blur-sm rounded-2xl p-6 mb-6 shadow-lg border border-slate-200/50">
    <h3 class="text-lg font-semibold text-slate-800 mb-4">Ajouter une nouvelle marque</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Nom de la marque</label>
        <input 
          type="text" 
          [(ngModel)]="newBrandName"
          placeholder="Ex: PEUGEOT, FIAT, RENAULT..."
          class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-colors">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Modèles (séparés par des virgules)</label>
        <input 
          type="text" 
          [(ngModel)]="newBrandModels"
          placeholder="Ex: 206, 307, 308, 508..."
          class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-colors">
      </div>
    </div>
    <div class="mt-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">URL du Logo (optionnel)</label>
        <input 
          type="url" 
          [(ngModel)]="newBrandLogoUrl"
          placeholder="https://example.com/logo.png"
          class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-colors">
      </div>
    </div>
    <div class="flex gap-4 mt-4">
      <button (click)="addBrand()" 
        [disabled]="loading || !newBrandName.trim()"
        class="bg-gradient-to-r from-purple-500 to-indigo-600 text-white px-6 py-2 rounded-lg font-semibold hover:from-purple-600 hover:to-indigo-700 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
        <div *ngIf="loading" class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div>
        {{ loading ? 'Ajout...' : 'Ajouter' }}
      </button>
      <button (click)="toggleAddForm()" 
        class="bg-slate-200 text-slate-700 px-6 py-2 rounded-lg font-semibold hover:bg-slate-300 transition-colors">
        Annuler
      </button>
    </div>
  </div>

  <!-- Search Bar -->
  <div class="bg-white/80 backdrop-blur-sm rounded-2xl p-6 mb-6 shadow-lg border border-slate-200/50">
    <div class="relative">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
      <input 
        type="text" 
        [(ngModel)]="searchQuery"
        (input)="onSearchChange()"
        placeholder="Rechercher une marque..."
        class="block w-full pl-10 pr-3 py-3 border border-slate-300 rounded-xl leading-5 bg-white placeholder-slate-500 focus:outline-none focus:placeholder-slate-400 focus:ring-2 focus:ring-purple-500 focus:border-purple-500 text-slate-900">
    </div>
  </div>

  <!-- Error Message -->
  <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl mb-6">
    {{ error }}
  </div>

  <!-- Loading State -->
  <div *ngIf="loading && !showAddForm" class="flex justify-center items-center py-12">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-500"></div>
  </div>

  <!-- Brands Grid -->
  <div *ngIf="!loading || showAddForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <div *ngFor="let brand of filteredBrands" 
         class="bg-white/80 backdrop-blur-sm rounded-2xl border border-slate-200/50 hover:border-purple-400/50 transition-all duration-300 transform hover:scale-105 hover:shadow-xl p-6 relative overflow-hidden">
      
      <!-- Status Badge -->
      <div class="absolute top-4 right-4">
        <span [ngClass]="brand.isActive ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'" 
              class="px-2 py-1 text-xs font-semibold rounded-full">
          {{ brand.isActive ? 'Actif' : 'Inactif' }}
        </span>
      </div>

      <!-- Brand Logo -->
      <div class="w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg overflow-hidden"
           [class]="getBrandLogo(brand) ? 'bg-white border border-slate-200' : 'bg-gradient-to-br from-purple-500 to-indigo-600'">
        <img 
          *ngIf="getBrandLogo(brand)" 
          [src]="getBrandLogo(brand)" 
          [alt]="brand.name + ' logo'"
          title="Logo de {{ brand.name }}"
          class="w-full h-full object-contain p-1"
          (error)="onImageError($event)">
        <svg 
          *ngIf="!getBrandLogo(brand)" 
          class="w-8 h-8 text-white" 
          fill="currentColor" 
          viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"></path>
        </svg>
      </div>

      <!-- Brand Info -->
      <div class="text-center mb-4">
        <h3 class="text-lg font-bold text-slate-800 mb-2">{{ brand.name }}</h3>
        <div class="text-slate-600 text-sm">
          <p class="font-medium">{{ brand.models.length || 0 }} modèle(s)</p>
          <div class="mt-2 max-h-20 overflow-y-auto">
            <span *ngFor="let model of brand.models; let last = last" class="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded mr-1 mb-1 inline-block">
              {{ model }}
            </span>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-2">
        <button (click)="toggleBrandStatus(brand)" 
          [ngClass]="brand.isActive ? 'bg-orange-500 hover:bg-orange-600' : 'bg-emerald-500 hover:bg-emerald-600'"
          class="flex-1 text-white px-3 py-2 rounded-lg text-sm font-medium transition-colors">
          {{ brand.isActive ? 'Désactiver' : 'Activer' }}
        </button>
        <button (click)="deleteBrand(brand)" 
          class="bg-red-500 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-red-600 transition-colors"
          title="Supprimer">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z" clip-rule="evenodd"></path>
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!loading && filteredBrands.length === 0" class="text-center py-12">
    <div class="w-24 h-24 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
      <svg class="w-12 h-12 text-slate-400" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"></path>
      </svg>
    </div>
    <h3 class="text-lg font-semibold text-slate-600 mb-2">Aucune marque trouvée</h3>
    <p class="text-slate-500 mb-4">Commencez par ajouter votre première marque</p>
    <button (click)="toggleAddForm()" 
      class="bg-gradient-to-r from-purple-500 to-indigo-600 text-white px-6 py-3 rounded-xl font-semibold hover:from-purple-600 hover:to-indigo-700 transition-all duration-200 shadow-lg hover:shadow-xl">
      Ajouter une marque
    </button>
  </div>
</div>
