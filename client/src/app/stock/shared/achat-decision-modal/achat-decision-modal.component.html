<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-2">
  <div class="bg-white rounded-2xl border border-slate-200 w-full max-w-2xl">
    <div class="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-t-2xl p-6">
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-4">
          <div class="w-14 h-14 bg-white/20 backdrop-blur-sm rounded-xl flex items-center justify-center">
            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
            </svg>
          </div>
          <div>
            <h3 class="text-2xl font-bold text-white">
              {{ actionType === 'entry' ? 'Bon d\'entrée' : 'Bon de retour' }}
            </h3>
            <p class="text-indigo-50 text-sm font-medium">Que souhaitez-vous faire ?</p>
          </div>
        </div>
        <button (click)="onClose()" class="text-white/80" title="Fermer">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="p-8">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <button (click)="onConsult()"
          class="bg-gradient-to-br from-indigo-50 to-purple-50 border-2 border-indigo-200 rounded-2xl p-6 flex flex-col items-center text-center">
          <div class="w-20 h-20 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center mb-4">
            <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
          </div>
          <h4 class="text-xl font-bold text-slate-800 mb-2">Consulter</h4>
          <p class="text-sm text-slate-600 leading-relaxed">Voir les documents existants</p>
        </button>

        <button (click)="onAdd()"
          class="bg-gradient-to-br from-emerald-50 to-green-50 border-2 border-emerald-200 rounded-2xl p-6 flex flex-col items-center text-center">
          <div class="w-20 h-20 bg-gradient-to-br from-emerald-500 to-green-600 rounded-2xl flex items-center justify-center mb-4">
            <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
          </div>
          <h4 class="text-xl font-bold text-slate-800 mb-2">Ajouter</h4>
          <p class="text-sm text-slate-600 leading-relaxed">Créer un nouveau document</p>
        </button>
      </div>
    </div>

    <div class="px-8 pb-6">
      <button (click)="onClose()"
        class="w-full bg-slate-100 text-slate-700 font-semibold py-3 px-4 rounded-xl">
        Annuler
      </button>
    </div>
  </div>
</div>
