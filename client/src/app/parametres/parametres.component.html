<div class="min-h-screen bg-gradient-to-br from-amber-50 via-blue-50 to-purple-50 p-4 md:p-6">
  <div class="max-w-7xl mx-auto">
    <div class="flex items-center justify-between mb-4 md:mb-6">
      <div class="flex items-center gap-3">
        <a routerLink="/home"
           class="w-10 h-10 md:w-11 md:h-11 bg-blue-400 text-gray-800 rounded-lg border border-blue-300 hover:bg-blue-500 transition-all flex items-center justify-center">
          <svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
          </svg>
        </a>
        <h2 class="text-2xl md:text-3xl font-bold text-gray-800">Paramètres</h2>
      </div>
      <div class="flex items-center gap-2">
        <button (click)="load()" class="px-3 py-2 bg-gray-700/70 hover:bg-gray-700 text-gray-800 rounded-lg">Réinitialiser</button>
        <button (click)="save()" [disabled]="saving" class="px-4 py-2 bg-pink-600 hover:bg-pink-500 text-gray-800 rounded-lg disabled:opacity-50">Enregistrer</button>
      </div>
    </div>

    <div *ngIf="loading" class="text-gray-400">Chargement...</div>
    <div *ngIf="error" class="text-red-400 mb-4">{{ error }}</div>

    <div class="bg-white/90 rounded-xl border border-gray-200 p-4 md:p-5 overflow-hidden shadow-lg">
      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
        <!-- Société & Logo -->
        <div class="bg-white/60 rounded-lg border border-gray-200 p-4 flex flex-col">
          <h3 class="text-lg font-semibold text-gray-800 mb-3">Société & Logo</h3>
          <label class="block text-sm text-gray-600 mb-1">Nom de la société</label>
          <input type="text" [(ngModel)]="settings.companyName" class="w-full bg-white/80 border border-gray-300 rounded px-3 py-2 text-gray-800 mb-3" placeholder="Nom"/>
          <label class="block text-sm text-gray-600 mb-1">Logo (URL)</label>
          <input type="text" [(ngModel)]="settings.logoUrl" class="w-full bg-white/80 border border-gray-300 rounded px-3 py-2 text-gray-800" placeholder="https://..."/>
          <div class="mt-3 h-14 flex items-center">
            <img *ngIf="settings.logoUrl" [src]="settings.logoUrl" alt="Logo" class="h-10 object-contain"/>
          </div>
        </div>

        <!-- Fidélité -->
        <div class="bg-white/60 rounded-lg border border-gray-200 p-4">
          <h3 class="text-lg font-semibold text-gray-800 mb-3">Fidélité</h3>
          <div class="flex items-center gap-3 mb-3">
            <input id="loy" type="checkbox" [(ngModel)]="settings.loyaltyEnabled" class="h-4 w-4"/>
            <label for="loy" class="text-gray-600">Activer points fidélité</label>
          </div>
          <label class="block text-sm text-gray-600 mb-1">Taux (points / 1 dt)</label>
          <input type="number" min="0" step="0.1" [(ngModel)]="settings.loyaltyRate" class="w-full bg-white/80 border border-gray-300 rounded px-3 py-2 text-gray-800"/>
        </div>

        <!-- Remises & Dettes -->
        <div class="bg-white/60 rounded-lg border border-gray-200 p-4">
          <h3 class="text-lg font-semibold text-gray-800 mb-3">Remises & Dettes</h3>
          <label class="block text-sm text-gray-600 mb-1">Remise max (%)</label>
          <input type="number" min="0" max="100" step="0.5" [(ngModel)]="settings.maxDiscountPercent" class="w-full bg-white/80 border border-gray-300 rounded px-3 py-2 text-gray-800 mb-3"/>
          <label class="block text-sm text-gray-600 mb-1">Dette max par client (dt)</label>
          <input type="number" min="0" step="0.001" [(ngModel)]="settings.defaultClientMaxDebt" class="w-full bg-white/80 border border-gray-300 rounded px-3 py-2 text-gray-800"/>
        </div>

        <!-- Raccourcis -->
        <div class="bg-white/60 rounded-lg border border-gray-200 p-4 xl:col-span-2">
          <h3 class="text-lg font-semibold text-gray-800 mb-3">Raccourcis clavier</h3>
          <textarea [(ngModel)]="settings.keyboardShortcuts" rows="3" class="w-full bg-white/80 border border-gray-300 rounded px-3 py-2 text-gray-800" placeholder='{"validate":"Enter","discount":"D"}'></textarea>
        </div>

        <!-- Périphériques -->
        <div class="bg-white/60 rounded-lg border border-gray-200 p-4 xl:col-span-1">
          <h3 class="text-lg font-semibold text-gray-800 mb-3">Périphériques</h3>
          <textarea [(ngModel)]="settings.devicesConfig" rows="3" class="w-full bg-white/80 border border-gray-300 rounded px-3 py-2 text-gray-800" placeholder='{"printer":"EPSON","drawer":true}'></textarea>
        </div>

        <!-- Utilisateurs & Accès -->
        <div class="bg-white/60 rounded-lg border border-gray-200 p-4">
          <h3 class="text-lg font-semibold text-gray-800 mb-2">Utilisateurs & Accès</h3>
          <p class="text-gray-600 text-sm">Gérer les rôles et permissions depuis le module Utilisateurs.</p>
        </div>

        <!-- Logs & Audit -->
        <div class="bg-white/60 rounded-lg border border-gray-200 p-4">
          <h3 class="text-lg font-semibold text-gray-800 mb-3">Logs & Audit</h3>
          <label class="block text-sm text-gray-600 mb-1">Rétention (jours)</label>
          <input type="number" min="7" step="1" [(ngModel)]="settings.auditRetentionDays" class="w-full bg-white/80 border border-gray-300 rounded px-3 py-2 text-gray-800"/>
        </div>
      </div>
    </div>
  </div>
</div>
