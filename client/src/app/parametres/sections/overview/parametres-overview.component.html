<div class="min-h-screen bg-gradient-to-br from-amber-50 via-blue-50 to-purple-50 p-4 md:p-6">
  <div class="max-w-7xl mx-auto">
    <div class="flex items-center justify-between mb-4 md:mb-6">
      <div class="flex items-center gap-3">
        <a routerLink="/home"
          class="w-10 h-10 md:w-11 md:h-11 bg-blue-400 text-gray-800 rounded-lg border border-blue-300 transition-all flex items-center justify-center">
          <svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
            </path>
          </svg>
        </a>
        <h2 class="text-2xl md:text-3xl font-bold text-gray-800">Paramètres</h2>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-gray-200 p-4 md:p-6 overflow-hidden shadow-xl">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-xl font-semibold text-gray-800">Que souhaitez-vous gérer ?</h3>
        <a routerLink="/home" class="text-sm text-gray-500 ">Retour à l'accueil</a>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">

        <button (click)="navigate('entreprises')" aria-label="Entreprises"
          class="p-4 rounded-xl border bg-gradient-to-br from-white to-teal-50 border-teal-200 text-left focus:ring-2 focus:ring-teal-400 focus:outline-none transition-transform">
          <div class="flex items-center gap-3 mb-1">
            <span
              class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-teal-100 text-teal-700 border border-teal-200">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
              </svg>
            </span>
            <div class="text-lg font-semibold text-gray-800">Entreprises</div>
          </div>
          <div class="text-sm text-gray-600">Info juridique, fiscalité, logos</div>
        </button>
        <button (click)="navigate('fidelite')" aria-label="Fidélité"
          class="p-4 rounded-xl border bg-gradient-to-br from-white to-emerald-50 border-emerald-200 text-left focus:ring-2 focus:ring-emerald-400 focus:outline-none transition-transform">
          <div class="flex items-center gap-3 mb-1">
            <span
              class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-emerald-100 text-emerald-700 border border-emerald-200">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M12 21l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 6 4 4 6.5 4c1.74 0 3.41 1 4.5 2.09C12.09 5 13.76 4 15.5 4 18 4 20 6 20 8.5c0 3.78-3.4 6.86-8.55 11.18L12 21z" />
              </svg>
            </span>
            <div class="text-lg font-semibold text-gray-800">Fidélité</div>
          </div>
          <div class="text-sm text-gray-600">Activation et taux</div>
        </button>
        <button (click)="navigate('depenses')" aria-label="Dépenses"
          class="p-4 rounded-xl border bg-gradient-to-br from-white to-amber-50 border-amber-200 text-left focus:ring-2 focus:ring-amber-400 focus:outline-none transition-transform">
          <div class="flex items-center gap-3 mb-1">
            <span
              class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-amber-100 text-amber-700 border border-amber-200">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1v22" />
                <path d="M17 5H9.5a3.5 3.5 0 100 7H14a3.5 3.5 0 110 7H6" />
              </svg>
            </span>
            <div class="text-lg font-semibold text-gray-800">Dépenses</div>
          </div>
          <div class="text-sm text-gray-600">Seuil d'auto-approbation</div>
        </button>
        <button (click)="navigate('impression')" aria-label="Impression"
          class="p-4 rounded-xl border bg-gradient-to-br from-white to-cyan-50 border-cyan-200 text-left focus:ring-2 focus:ring-cyan-400 focus:outline-none transition-transform">
          <div class="flex items-center gap-3 mb-1">
            <span
              class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-cyan-100 text-cyan-700 border border-cyan-200">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9V2h12v7" />
                <path d="M6 18h12v4H6z" />
                <rect x="6" y="14" width="12" height="4" />
                <path d="M6 14H4a2 2 0 01-2-2V9a2 2 0 012-2h16a2 2 0 012 2v3a2 2 0 01-2 2h-2" />
              </svg>
            </span>
            <div class="text-lg font-semibold text-gray-800">Impression</div>
          </div>
          <div class="text-sm text-gray-600">Logo, formats, textes, options</div>
        </button>
        <button (click)="navigate('peripheriques')" aria-label="Périphériques"
          class="p-4 rounded-xl border bg-gradient-to-br from-white to-indigo-50 border-indigo-200 text-left focus:ring-2 focus:ring-indigo-400 focus:outline-none transition-transform">
          <div class="flex items-center gap-3 mb-1">
            <span
              class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-indigo-100 text-indigo-700 border border-indigo-200">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="14" rx="2" />
                <path d="M8 20h8" />
              </svg>
            </span>
            <div class="text-lg font-semibold text-gray-800">Périphériques</div>
          </div>
          <div class="text-sm text-gray-600">Imprimante, tiroir, coupe, test</div>
        </button>
        <button (click)="navigate('cloture')" aria-label="Clôture"
          class="p-4 rounded-xl border bg-gradient-to-br from-white to-rose-50 border-rose-200 text-left focus:ring-2 focus:ring-rose-400 focus:outline-none transition-transform">
          <div class="flex items-center gap-3 mb-1">
            <span
              class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-rose-100 text-rose-700 border border-rose-200">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12h18" />
                <path d="M19 12v6a2 2 0 01-2 2H7a2 2 0 01-2-2v-6" />
                <path d="M7 12V7a5 5 0 0110 0v5" />
              </svg>
            </span>
            <div class="text-lg font-semibold text-gray-800">Clôture</div>
          </div>
          <div class="text-sm text-gray-600">Seuils et dénominations</div>
        </button>
        <button (click)="navigate('logs')" aria-label="Logs et Audit"
          class="p-4 rounded-xl border bg-gradient-to-br from-white to-amber-50 border-amber-200 text-left focus:ring-2 focus:ring-amber-400 focus:outline-none transition-transform">
          <div class="flex items-center gap-3 mb-1">
            <span
              class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-amber-100 text-amber-700 border border-amber-200">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="14" rx="2" />
                <path d="M8 21h8" />
                <path d="M12 7v6" />
                <path d="M9 10h6" />
              </svg>
            </span>
            <div class="text-lg font-semibold text-gray-800">Logs & Audit</div>
          </div>
          <div class="text-sm text-gray-600">Rétentions et historique</div>
        </button>
        <button (click)="navigate('documents')" aria-label="Documents"
          class="p-4 rounded-xl border bg-gradient-to-br from-white to-violet-50 border-violet-200 text-left focus:ring-2 focus:ring-violet-400 focus:outline-none transition-transform">
          <div class="flex items-center gap-3 mb-1">
            <span
              class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-violet-100 text-violet-700 border border-violet-200">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
                <polyline points="14,2 14,8 20,8" />
                <line x1="16" y1="13" x2="8" y2="13" />
                <line x1="16" y1="17" x2="8" y2="17" />
                <polyline points="10,9 9,9 8,9" />
              </svg>
            </span>
            <div class="text-lg font-semibold text-gray-800">Documents</div>
          </div>
          <div class="text-sm text-gray-600">Configuration par défaut des documents</div>
        </button>

      </div>
    </div>
  </div>
</div>
