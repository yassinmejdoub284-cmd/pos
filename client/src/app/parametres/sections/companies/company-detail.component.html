<div class="min-h-screen bg-slate-50 p-4 md:p-6">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <a routerLink="/parametres/entreprises"
                    class="w-10 h-10 bg-white text-gray-600 rounded-lg border border-gray-200 flex items-center justify-center hover:bg-gray-50 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </a>
                <h1 class="text-2xl font-bold text-gray-800">{{ isNew ? 'Nouvelle Entreprise' : 'Modifier l\'Entreprise'
                    }}</h1>
            </div>
            <div class="flex gap-2" *ngIf="!isNew">
                <button (click)="deleteCompany()"
                    class="px-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 rounded-lg transition-colors font-medium">
                    Supprimer
                </button>
            </div>
        </div>

        <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6">
            {{ error }}
        </div>

        <form (ngSubmit)="save()" class="space-y-6">
            <!-- Identification -->
            <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
                <h2 class="text-lg font-semibold text-gray-900 mb-4 pb-2 border-b border-gray-100">Identification</h2>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="md:col-span-2 flex items-center gap-4">
                        <div
                            class="w-24 h-24 bg-gray-100 rounded-xl border border-gray-200 flex items-center justify-center overflow-hidden relative group">
                            <img *ngIf="company.logoUrl" [src]="company.logoUrl" class="w-full h-full object-contain">
                            <span *ngIf="!company.logoUrl" class="text-3xl font-bold text-gray-300">{{
                                company.raisonSociale?.charAt(0) || '?' }}</span>
                            <label *ngIf="!isNew"
                                class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
                                <input type="file" (change)="onLogoSelected($event)" accept="image/*" class="hidden">
                                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                            </label>
                        </div>
                        <div class="flex-1">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Raison Sociale <span
                                    class="text-red-500">*</span></label>
                            <input type="text" [(ngModel)]="company.raisonSociale" name="raisonSociale" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <p *ngIf="isNew" class="text-xs text-gray-500 mt-1">Le logo pourra être ajouté après la
                                création.</p>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Forme Juridique</label>
                        <select [(ngModel)]="company.formeJuridique" name="formeJuridique"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <option value="SUARL">SUARL</option>
                            <option value="SARL">SARL</option>
                            <option value="SA">SA</option>
                            <option value="SNC">SNC</option>
                            <option value="PERSONNE PHYSIQUE">Personne Physique</option>
                            <option value="AUTRE">Autre</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Activité</label>
                        <input type="text" [(ngModel)]="company.activite" name="activite"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
            </div>

            <!-- Fiscalité -->
            <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
                <h2 class="text-lg font-semibold text-gray-900 mb-4 pb-2 border-b border-gray-100">Fiscalité</h2>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Matricule Fiscal <span
                                class="text-red-500">*</span></label>
                        <input type="text" [(ngModel)]="company.matriculeFiscal" name="matriculeFiscal" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Registre de Commerce</label>
                        <input type="text" [(ngModel)]="company.registreCommerce" name="registreCommerce"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">RNE</label>
                        <input type="text" [(ngModel)]="company.rne" name="rne"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Capital Social</label>
                        <input type="number" [(ngModel)]="company.capitalSocial" name="capitalSocial"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <div class="flex items-center gap-4">
                        <div class="flex items-center h-full pt-6">
                            <input type="checkbox" [(ngModel)]="company.tvaAssujetti" name="tvaAssujetti"
                                id="tvaAssujetti"
                                class="rounded border-gray-300 text-blue-600 shadow-sm focus:border-blue-300 focus:ring focus:ring-blue-200 focus:ring-opacity-50">
                            <label for="tvaAssujetti" class="ml-2 block text-sm text-gray-900">Assujetti à la
                                TVA</label>
                        </div>
                        <div class="flex-1" *ngIf="company.tvaAssujetti">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Taux TVA (%)</label>
                            <input type="number" [(ngModel)]="company.tauxTva" name="tauxTva"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Numéro TVA (Si différent)</label>
                        <input type="text" [(ngModel)]="company.numeroTva" name="numeroTva"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
            </div>

            <!-- Coordonnées -->
            <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
                <h2 class="text-lg font-semibold text-gray-900 mb-4 pb-2 border-b border-gray-100">Coordonnées</h2>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Adresse</label>
                        <textarea [(ngModel)]="company.adresse" name="adresse" rows="2"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Ville</label>
                        <input type="text" [(ngModel)]="company.ville" name="ville"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Code Postal</label>
                        <input type="text" [(ngModel)]="company.codePostal" name="codePostal"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Téléphone</label>
                        <input type="tel" [(ngModel)]="company.telephone" name="telephone"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" [(ngModel)]="company.email" name="email"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center justify-end gap-3 pt-4">
                <a routerLink="/parametres/entreprises"
                    class="px-6 py-2.5 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 font-medium transition-colors">
                    Annuler
                </a>
                <button type="submit" [disabled]="saving || !company.raisonSociale || !company.matriculeFiscal"
                    class="px-6 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                    <svg *ngIf="saving" class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                    {{ isNew ? 'Créer l\'entreprise' : 'Enregistrer les modifications' }}
                </button>
            </div>
        </form>
    </div>
</div>
