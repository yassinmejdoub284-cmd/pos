<!-- Enterprise Layout Component -->
<div class="enterprise-container" [style]="'--primary-color: ' + BILLING_THEME.primaryColor + '; --secondary-color: ' + BILLING_THEME.secondaryColor + '; --accent-color: ' + BILLING_THEME.accentColor + '; --text-color: ' + BILLING_THEME.textColor + '; --sidebar-bg: ' + BILLING_THEME.sidebarBg + '; --sidebar-hover: ' + BILLING_THEME.sidebarHover + '; --card-bg: ' + BILLING_THEME.cardBg + '; --border-color: ' + BILLING_THEME.borderColor">
  
  <!-- Sidebar -->
  <app-enterprise-sidebar
    [activeSection]="activeSection"
    [sidebarCollapsed]="sidebarCollapsed"
    (toggleSidebar)="onToggleSidebar()"
    (navigateToSection)="onNavigateToSection($event)">
  </app-enterprise-sidebar>

  <!-- Main Content Area -->
  <main class="main-content">
    <!-- Top Header -->
    <header class="main-header">
      <div class="header-left">
        <button *ngIf="showBackButton" class="back-btn" (click)="goBack()">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
          {{ backButtonText }}
        </button>
        <div class="page-info">
          <h1 class="page-title">{{ pageTitle }}</h1>
          <p class="page-subtitle">{{ pageSubtitle }}</p>
        </div>
      </div>
      <div class="header-right">
        <div class="company-info">
          <span class="company-name">{{ currentUser?.companyName || 'Entreprise' }}</span>
        </div>
        <div class="header-actions">
          <ng-content select="[slot=header-actions]"></ng-content>
        </div>
      </div>
    </header>

    <!-- Content Area -->
    <div class="content-area">
      <ng-content></ng-content>
    </div>
  </main>
</div>
