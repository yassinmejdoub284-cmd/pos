<div class="p-4">
  <div class="bg-white rounded-xl border border-slate-200 p-4 mb-4">
    <div class="flex items-center justify-between">
      <span class="text-lg font-bold text-slate-800">Bon de Retour</span>
      <div class="space-x-2">
        <button (click)="submit()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg">Enregistrer</button>
        <button (click)="cancel()" class="bg-slate-200 text-slate-800 px-4 py-2 rounded-lg">Annuler</button>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <div class="lg:col-span-2 bg-white rounded-xl border border-slate-200 p-4">
      <div class="mb-3">
        <input [formControl]="itemSearchCtrl" placeholder="Rechercher produit ou code barre" title="Rechercher" class="w-full border rounded px-3 py-2" />
      </div>

      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2 mb-4 max-h-64 overflow-y-auto">
        <button *ngFor="let p of filteredProducts()" (click)="handleProductClick(p)" class="border rounded p-2 text-left">
          <div class="font-semibold">{{ p.name }}</div>
          <div class="text-xs text-slate-500">{{ p.barcode || 'N/A' }}</div>
        </button>
      </div>

      <div class="space-y-2">
        <div *ngFor="let ctrl of itemsArray.controls; let i = index" class="border rounded p-2">
          <div class="flex items-center justify-between">
            <div class="font-semibold">{{ getProductName(ctrl.get('productId')?.value) }}</div>
            <button (click)="removeItem(i)" class="text-red-600 text-sm">Supprimer</button>
          </div>
          <div class="grid grid-cols-3 gap-2 mt-2">
            <div>
              <label class="text-xs text-slate-600">Quantité</label>
              <input type="number" min="0.001" step="0.001" placeholder="0.000" title="Quantité" [formControl]="asFormControl(ctrl.get('quantity'))" class="w-full border rounded px-2 py-1" />
            </div>
            <div>
              <label class="text-xs text-slate-600">Prix d'achat</label>
              <input type="number" min="0" step="0.001" placeholder="0.000" title="Prix d'achat" [formControl]="asFormControl(ctrl.get('unitPrice'))" class="w-full border rounded px-2 py-1" />
            </div>
            <div>
              <label class="text-xs text-slate-600">Lot</label>
              <input type="text" placeholder="Référence du lot" title="Lot" [formControl]="asFormControl(ctrl.get('batch'))" class="w-full border rounded px-2 py-1" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 p-4">
      <div class="text-sm text-slate-600">Articles: {{ itemsArray.length }}</div>
    </div>
  </div>
</div>
