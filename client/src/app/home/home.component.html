<div class="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-black 2xl:pt-20 px-4 pt-5">
  <!-- Header Section -->
  <div class="text-center mb-6">
    <div class="bg-gray-800/50 rounded-2xl p-4 lg:p-6 border border-gray-700/50 max-w-2xl mx-auto">
      <div class="flex max-md:flex-col items-center justify-center">
        <img src="/logo.webp" alt="Pâtisserie POS Logo" class="w-12 h-12 max-md:w-32 max-md:h-32 lg:w-16 lg:h-16 mr-3 lg:mr-4">
        <h1 class="text-2xl lg:text-3xl 2xl:text-4xl font-bold text-pink-400">SoluMove Tech.</h1>
      </div>
      <p class="text-gray-300 text-sm lg:text-base">Votre pâtisserie, notre innovation...</p>
      <div class="w-12 lg:w-16 h-1 bg-gradient-to-r from-pink-500 to-purple-600 mx-auto mt-2 rounded-full"></div>
    </div>
  </div>
  
  <!-- Navigation Grid -->
  <div class="grid grid-cols-3 gap-3 lg:gap-4 max-w-6xl mx-auto">
    <a *ngFor="let item of navigationItems" [routerLink]="item.route" class="group">
      <div class="bg-gray-800/50 rounded-xl border border-gray-700/50 hover:border-pink-400/50 transition-all duration-300 transform hover:scale-95 p-4 lg:p-5 text-center h-full flex flex-col justify-center relative overflow-hidden min-h-[120px] lg:min-h-[140px]">
        <!-- Background Gradient Effect -->
        <div class="absolute inset-0 bg-gradient-to-br from-transparent via-transparent to-pink-500/5 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
        
        <!-- Icon Container -->
        <div class="relative z-10">
          <div class="w-10 h-10 lg:w-12 lg:h-12 bg-gradient-to-br rounded-full flex items-center justify-center mx-auto mb-2 lg:mb-3 group-hover:scale-110 transition-transform duration-300 shadow-lg" [ngClass]="item.color">
            <svg class="w-5 h-5 lg:w-6 lg:h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon"></path>
            </svg>
          </div>
          
          <!-- Title and Description -->
          <h3 class="text-sm lg:text-base font-semibold text-white mb-1 group-hover:text-pink-400 transition-colors duration-300">{{ item.title }}</h3>
          <p class="text-gray-400 text-xs lg:text-sm group-hover:text-gray-300 transition-colors duration-300">{{ item.description }}</p>
        </div>
        
        <!-- Hover Border Effect -->
        <div class="absolute inset-0 rounded-xl border-2 border-transparent group-hover:border-pink-400/20 transition-all duration-300"></div>
      </div>
    </a>
  </div>
  
  <!-- Footer Section -->
  <div class="text-center mt-6 pb-4">
    <div class="bg-gray-800/30 rounded-xl p-3 border border-gray-700/30 max-w-md mx-auto">
      <p class="text-gray-400 text-xs lg:text-sm mb-2">Système de gestion intégré pour pâtisserie</p>
      <div class="flex justify-center space-x-2">
        <div class="w-2 h-2 bg-pink-400 rounded-full"></div>
        <div class="w-2 h-2 bg-purple-400 rounded-full"></div>
        <div class="w-2 h-2 bg-blue-400 rounded-full"></div>
      </div>
    </div>
  </div>
</div>
